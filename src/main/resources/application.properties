spring.application.name=pdms-gateway
spring.main.web-application-type=reactive
server.port=${PDMS_GATEWAY_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# --- Shared PDMS schema: migrated here before gateway startup completes. ---
# Flyway owns its connection; the request path has no JDBC DataSource or pool.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.flyway.enabled=${PDMS_GATEWAY_FLYWAY_ENABLED:true}
spring.flyway.url=${PDMS_GATEWAY_FLYWAY_URL:jdbc:postgresql://localhost:5432/pdms}
spring.flyway.user=${PDMS_GATEWAY_FLYWAY_USER:pdms_user}
spring.flyway.password=${PDMS_GATEWAY_FLYWAY_PASSWORD:}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.table=flyway_schema_history
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.fail-on-missing-locations=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
# Unknown applied migrations must fail validation, including future versions.
spring.flyway.ignore-migration-patterns=
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=2s
spring.flyway.lock-retry-count=60

# --- PDMS gateway (see docs/HOW_IT_WORKS.md) ---
pdms.gateway.routing-file=${PDMS_GATEWAY_ROUTING_FILE:config/routing.json}
pdms.gateway.run-id=${PDMS_GATEWAY_RUN_ID:adhoc}
pdms.gateway.instance-id=${PDMS_GATEWAY_INSTANCE_ID:}
pdms.gateway.log-dir=${PDMS_GATEWAY_LOG_DIR:logs}
pdms.gateway.admin-token=${PDMS_GATEWAY_ADMIN_TOKEN:}
# Internal backend worker control used during architecture handovers.
pdms.gateway.outbox.admin-token=${PDMS_OUTBOX_ADMIN_TOKEN:}
pdms.gateway.outbox.timeout=${PDMS_GATEWAY_OUTBOX_TIMEOUT:10s}
# One in-memory backend flag gates business HTTP and ordinary outbox work together.
# Disable management only for stand-in demos; real deployments reconcile the initial owner automatically.
pdms.gateway.runtime.managed=${PDMS_GATEWAY_RUNTIME_MANAGED:true}
pdms.gateway.runtime.drain-timeout=${PDMS_GATEWAY_RUNTIME_DRAIN_TIMEOUT:30s}
# Scheduled selection application requires this startup permission.
pdms.gateway.selection.allow-apply=${PDMS_GATEWAY_SELECTION_ALLOW_APPLY:false}
pdms.gateway.experiment.file=${PDMS_GATEWAY_EXPERIMENT_FILE:classpath:selection-experiment.json}
pdms.gateway.log-queue-capacity=${PDMS_GATEWAY_LOG_QUEUE:65536}
pdms.gateway.stats-capacity=${PDMS_GATEWAY_STATS_CAPACITY:200000}

# --- Spring Cloud Gateway: one catch-all route; the target is chosen per request by TargetUriGlobalFilter ---
spring.cloud.gateway.server.webflux.metrics.enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=pdms-catch-all
spring.cloud.gateway.server.webflux.routes[0].uri=http://placeholder.invalid
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**,/actuator,/actuator/**,/v3/**,/swagger-ui.html,/swagger-ui/**

# Explicit client settings (library defaults are not relied on). Values are provisional until the pilot (plan 6.2, 6.4).
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=${PDMS_GATEWAY_RESPONSE_TIMEOUT:60s}
spring.cloud.gateway.server.webflux.httpclient.pool.type=fixed
spring.cloud.gateway.server.webflux.httpclient.pool.max-connections=${PDMS_GATEWAY_ADMISSION_MAX:200}
spring.cloud.gateway.server.webflux.httpclient.pool.acquire-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=30s
# Pool-only metrics have no request URI labels. HTTP request metrics remain custom/bounded above.
spring.cloud.gateway.server.webflux.httpclient.pool.metrics=true

# --- Actuator: health and prometheus only (same port in this first version) ---
# Moved off /actuator: that path is the PDMS Actuator and is proxied to the backends.
management.endpoints.web.base-path=/gateway/actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# --- Liveness probes (GET <backend>/actuator/health; see docs/OBSERVABILITY.md) ---
pdms.gateway.health-interval=${PDMS_GATEWAY_HEALTH_INTERVAL:2s}
pdms.gateway.health-timeout=${PDMS_GATEWAY_HEALTH_TIMEOUT:1s}
pdms.gateway.health-fail-threshold=${PDMS_GATEWAY_HEALTH_FAIL:3}
pdms.gateway.health-success-threshold=${PDMS_GATEWAY_HEALTH_SUCCESS:2}

# --- Admission: same limits for every backend process. The connection pool must not be smaller than the in-flight limit. ---
pdms.gateway.admission-max-in-flight=${PDMS_GATEWAY_ADMISSION_MAX:200}
pdms.gateway.admission-queue=${PDMS_GATEWAY_ADMISSION_QUEUE:200}
pdms.gateway.admission-max-wait=${PDMS_GATEWAY_ADMISSION_WAIT:2s}

# --- Forwarding headers: web/ForwardingHeaderPolicy removes everything the client sent and sets X-Forwarded-For, -Proto
# and -Host itself, after every Spring Cloud Gateway header filter. Their own forwarding filters are off.
spring.cloud.gateway.server.webflux.x-forwarded.enabled=false
spring.cloud.gateway.server.webflux.forwarded.enabled=false
